name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          uname -m

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run release script tests
        run: scripts/test-release-scripts.sh

      - name: Run build script tests
        run: scripts/test-build-script.sh

      - name: Loop the flaky test
        run: |
          set -o pipefail
          xcodebuild -scheme TransFlex -derivedDataPath DerivedData -destination 'platform=macOS' CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build-for-testing > build.log 2>&1 || { tail -40 build.log; exit 1; }
          for round in 1 2 3 4 5 6; do
            xcodebuild -scheme TransFlex -derivedDataPath DerivedData -destination 'platform=macOS' test-without-building -only-testing:TransFlexTests/PopupWindowControllerTests -test-iterations 40 > "loop-$round.log" 2>&1 || true
            grep -E "Executed [0-9]+ tests" "loop-$round.log" | tail -1
          done
          xcodebuild -scheme TransFlex -derivedDataPath DerivedData -destination 'platform=macOS' test-without-building -test-iterations 3 > loop-full.log 2>&1 || true
          grep -E "Executed [0-9]+ tests" loop-full.log | tail -1
          grep -h -B40 -A3 "testPermissionCardGrowsThePopupToFit\]' failed" loop-*.log | grep -E "DEBUG-7c1e|Test Case|Output-only show|error:" || echo "no failure of the permission card test"
          echo "--- one passing sample"
          grep -h -B25 "testPermissionCardGrowsThePopupToFit\]' passed" loop-1.log | grep -E "DEBUG-7c1e|Test Case|Output-only show" | tail -24

  intel-tests:
    name: Intel Test Probe
    if: false
    runs-on: macos-26-intel
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Print toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version
          uname -m

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        run: make test
